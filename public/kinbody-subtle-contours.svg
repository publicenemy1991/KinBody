<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Subtle fade gradient masks to make contours disappear towards edges -->
    <radialGradient id="logoHillGlow" cx="18%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#00E8A6" stop-opacity="0.30"/>
      <stop offset="40%" stop-color="#00E8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00E8A6" stop-opacity="0.0"/>
    </radialGradient>

    <radialGradient id="ctaHillGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00E8A6" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#00E8A6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00E8A6" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="diagonalFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E8A6" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#00E8A6" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#00E8A6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E8A6" stop-opacity="0.05"/>
    </linearGradient>

    <mask id="topoMask">
      <rect x="0" y="0" width="800" height="1600" fill="url(#diagonalFade)" />
      <rect x="0" y="0" width="800" height="1600" fill="url(#logoHillGlow)" style="mix-blend-mode: screen;" />
      <rect x="0" y="0" width="800" height="1600" fill="url(#ctaHillGlow)" style="mix-blend-mode: screen;" />
    </mask>
  </defs>

  <g mask="url(#topoMask)" stroke="#00E8A6" stroke-width="1.2" fill="none">
